<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมตอบคำถาม - Quiz Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-gamepad"></i> เกมตอบคำถามชวนสนุก</h1>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">หน้าแรก</a>
            <a href="game.html" class="nav-link active">เล่นเกมตอบคำถาม</a>
        </nav>
    </header>

    <main>
        <div class="glass-card quiz-card">
            <div id="quizBox">
                <div class="quiz-header">
                    <span id="questionNumber" class="badge">คำถามที่ 1/4</span>
                    <span id="scoreText" class="badge score-badge">คะแนน: 0</span>
                </div>
                
                <h2 id="questionText" class="question-title">ข้อความคำถามจะปรากฏที่นี่</h2>

                <div id="optionsContainer" class="options-container">
                    </div>
            </div>

            <div id="resultBox" class="result-container hidden">
                <i class="fa-solid fa-trophy trophy-icon"></i>
                <h2>จบเกมเรียบร้อย! ไปอ่านคำอวยพรวันเกิด!!</h2>
                <p id="finalScore" class="final-score-text">คุณได้คะแนน 0 จาก 4 คะแนน</p>
                <div class="button-box">
                    <button onclick="restartQuiz()" class="submit-btn">
                        <i class="fa-solid fa-rotate-right"></i> เล่นใหม่อีกครั้ง
                    </button>
                    <a href="index.html" class="nav-btn secondary-btn">
                         <i class="fa-solid fa-house"></i> กลับหน้าแรก
                    </a>
        
                    <a href="Wish.html" class="nav-btn outline-btn">
                        <i class="fa-solid fa-cake-candles"></i> ไปอ่านคำอวยพรวันเกิด
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My Quiz Website | All Rights Reserved</p>
    </footer>

    <script>
        // ชุดข้อมูลคำถาม ตัวเลือก และคำตอบที่ถูกต้อง (อ้างอิงลำดับ index 0, 1, 2, 3)
        const questions = [
            {
                question: "จูไลน์คบกับแฟนวันที่เท่าไหร่?",
                options: ["11 ตุลาคม", "8 กันยายน", "8 ธันวาคม", "13 มีนาคม"],
                answer: 2
            },
            {
                question: "เดทแรกของจูไลน์กับไบท์คือวันที่เท่าไหร่",
                options: ["5 พฤศจิกายน", "13 ธันวาคม", "6 พฤศจิกายน", "6 ธันวาคม"],
                answer: 0
            },
            {
                question: "วันนี้เป็นวันอะไร",
                options: ["วันเกิดจูไลน์", "วันครบรอบ7เดือน", "วันเกิดและครบรอบ9เดือน", "วันเกิดไบท์"],
                answer: 2
            },
            {
                question: "ไบท์รักจูไลน์แค่ไหน",
                options: ["แค่นี้", "ติ๊ดนึง", "นิดหน่อย", "เท่านี้เล้ยยยยยยยยยยยย"],
                answer: 3
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // เริ่มต้นโหลดคำถามแรกเมื่อเปิดหน้าเว็บ
        showQuestion();

        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            
            // อัปเดตข้อความคำถามและส่วนหัว
            document.getElementById('questionNumber').innerText = `คำถามที่ ${currentQuestionIndex + 1}/${questions.length}`;
            document.getElementById('questionText').innerText = currentQuestion.question;
            
            // ล้างตัวเลือกเดิมออกแล้วสร้างตัวเลือกใหม่
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            currentQuestion.options.forEach((optionText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex) {
            const currentQuestion = questions[currentQuestionIndex];
            
            if (selectedIndex === currentQuestion.answer) {
                score++;
                document.getElementById('scoreText').innerText = `คะแนน: ${score}`;
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizBox').classList.add('hidden');
            document.getElementById('resultBox').classList.remove('hidden');
            document.getElementById('finalScore').innerText = `คุณทำได้ ${score} จาก ${questions.length} คะแนน`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('scoreText').innerText = `คะแนน: 0`;
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('quizBox').classList.remove('hidden');
            showQuestion();
        }
    </script>
</body>
</html>
